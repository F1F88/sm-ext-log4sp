name: Build plugin - manager

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sourcemod/scripting/log4sp_manager.sp'
  push:
    paths:
      - 'sourcemod/scripting/log4sp_manager.sp'
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string

jobs:
  build:
    name: build with ${{ matrix.sm_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sm_version: [sm_latest, sm_1_12, sm_1_11]
        include:
          - sm_version: sm_latest
            sm_ref: "1.13.x"
          - sm_version: sm_1_12
            sm_ref: "1.12.x"
          - sm_version: sm_1_11
            sm_ref: "1.11.x"

    steps:
      - name: Check out Log4sp
        uses: actions/checkout@v6
        with:
          path: log4sp
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup SourcePawn Compiler
        id: setup_sp
        uses: rumblefrog/setup-sp@master
        with:
          version: ${{ matrix.sm_ref }}
          version-file: log4sp/sourcemod/scripting/log4sp_manager.sp
          define-name: PLUGIN_VERSION

      - name: Compiling plugin log4sp manager
        working-directory: log4sp
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          OUTPUT_DIR="build/log4sp.plugin"
          mkdir -p "$OUTPUT_DIR"

          COMPILE_ARGS=(
            "sourcemod/scripting/log4sp_manager.sp"
            -i "sourcemod/scripting/include"
            -o "$OUTPUT_DIR/log4sp_manager.smx"
            "NDEBUG="
          )

          spcomp "${COMPILE_ARGS[@]}"

      - name: Package
        id: package
        shell: bash
        working-directory: log4sp
        run: |
          mkdir -p "build/package/addons/sourcemod/plugins"
          mkdir -p "build/package/addons/sourcemod/scripting"
          cp "build/log4sp.plugin/log4sp_manager.smx" "build/package/addons/sourcemod/plugins"
          cp -r "sourcemod/scripting/include" "build/package/addons/sourcemod/scripting"

          short_hash="${GITHUB_SHA::7}"
          echo "short_hash=${short_hash}" >> "$GITHUB_OUTPUT"

      - name: Uploading package
        uses: actions/upload-artifact@v7
        with:
          name: sm-plugin-log4sp_manager-${{ steps.setup_sp.outputs.plugin-version }}.${{ steps.package.outputs.short_hash }}-${{ matrix.sm_version }}
          path: log4sp/build/package
          if-no-files-found: error
