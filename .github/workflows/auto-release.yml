name: Auto Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-extension:
    name: Build extension
    uses: ./.github/workflows/build-extension.yml
    with:
      source_ref: ${{ github.ref }}
    secrets: inherit

  build-plugin-manager:
    name: Build plugin manager
    uses: ./.github/workflows/build-plugin-manager.yml
    with:
      source_ref: ${{ github.ref }}
    secrets: inherit

  release:
    name: Merge packages and release
    runs-on: ubuntu-latest
    needs:
      - build-extension
      - build-plugin-manager

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Merge release packages
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import re
          import shutil
          from pathlib import Path

          ARTIFACTS_DIR = Path("artifacts")
          RELEASE_DIR = Path("release")

          # element = {<path>, <version>, <hash>, <os>, <sm>, <arch>}
          EXTENSION_ARTIFACTS = []

          # element = {<path>, <version>, <hash>, <sm>, <variant>}
          PLUGIN_MANAGER_ARTIFACTS = []

          # Parse artifacts
          for item in sorted(ARTIFACTS_DIR.iterdir()):
            if not item.is_dir():
              continue

            # sm-ext-log4sp-v<version>.<hash>-<os>-<sm>-<arch>
            extension_re = re.compile(
              r"^sm-ext-log4sp-v"
              r"(?P<version>\d+\.\d+\.\d+)\."
              r"(?P<hash>[0-9a-f]{7})-"
              r"(?P<os>[^-]+)-"
              r"(?P<sm>[^-]+)-"
              r"(?P<arch>x86|x64)$"
            )
            match = extension_re.fullmatch(item.name)
            if match:
              EXTENSION_ARTIFACTS.append({
                "path":     item,
                "version":  match.group("version"),
                "hash":     match.group("hash"),
                "os":       match.group("os"),
                "sm":       match.group("sm"),
                "arch":     match.group("arch"),
              })
              continue

            # sm-plugin-log4sp_manager-v<version>.<hash>-<sm>-<variant>
            plugin_manager_re = re.compile(
              r"^sm-plugin-log4sp_manager-v"
              r"(?P<version>\d+\.\d+\.\d+)\."
              r"(?P<hash>[0-9a-f]{7})-"
              r"(?P<sm>[^-]+)-"
              r"(?P<variant>extension|header_only)$"
            )
            match = plugin_manager_re.fullmatch(item.name)
            if match:
              PLUGIN_MANAGER_ARTIFACTS.append({
                "path":     item,
                "version":  match.group("version"),
                "hash":     match.group("hash"),
                "sm":       match.group("sm"),
                "variant":  match.group("variant"),
              })
              continue

            print(f"::warning:: Ignore unrelated artifact: {item.name}")

          # Valid artifacts
          if not EXTENSION_ARTIFACTS:
            raise SystemExit("::error:: No extension artifacts were found.")

          if not PLUGIN_MANAGER_ARTIFACTS:
            raise SystemExit("::error:: No plugin-manager artifacts were found.")

          revisions = {(i["version"], i["hash"]) for i in EXTENSION_ARTIFACTS}
          if len(revisions) != 1:
            raise SystemExit(f"::error:: Multiple extension revisions: {revisions}")

          revisions = {(i["version"], i["hash"]) for i in PLUGIN_MANAGER_ARTIFACTS}
          if len(revisions) != 1:
            raise SystemExit(f"::error:: Multiple plugin-manager revisions: {revisions}")

          keys = [(i["os"], i["sm"], i["arch"])for i in EXTENSION_ARTIFACTS]
          if len(keys) != len(set(keys)):
            raise SystemExit(f"::error:: Duplicate extension artifact: {keys}")

          keys = [(i["sm"], i["variant"]) for i in PLUGIN_MANAGER_ARTIFACTS]
          if len(keys) != len(set(keys)):
            raise SystemExit(f"::error:: Duplicate plugin-manager artifact: {keys}")

          RELEASE_DIR.mkdir(parents=True, exist_ok=True)

          # Merge extension arch
          for i in EXTENSION_ARTIFACTS:
            dest = (RELEASE_DIR / f'sm-ext-log4sp-v{i["version"]}.{i["hash"]}-{i["os"]}-{i["sm"]}')
            shutil.copytree(i["path"], dest, dirs_exist_ok=True)

          # Merge plugin-manager
          for i in PLUGIN_MANAGER_ARTIFACTS:
            if i["variant"] == "extension":
              # Merge plugin-manager extension variant into the same sm version of extension
              for j in EXTENSION_ARTIFACTS:
                if i["sm"] == j["sm"]:
                  dest = (RELEASE_DIR / f'sm-ext-log4sp-v{j["version"]}.{j["hash"]}-{j["os"]}-{j["sm"]}')
                  shutil.copytree(i["path"], dest, dirs_exist_ok=True)
            else:
              # Copy plugin-manager header_only variant into release dir
              dest = (RELEASE_DIR / f'sm-plugin-log4sp_manager-v{i["version"]}.{i["hash"]}-{i["sm"]}-{i["variant"]}')
              shutil.copytree(i["path"], dest, dirs_exist_ok=False)
          PY

      - name: Upload packaged artifacts for validation
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: packaged-artifacts
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: release/*
